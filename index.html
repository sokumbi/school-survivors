<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16161c">
<title>학교 서바이버</title>
<style>
  html,body{margin:0;height:100%;background:#16161c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100vw;height:100vh}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:rgba(12,12,20,.8);text-align:center;padding:max(12px,env(safe-area-inset-top)) 16px 12px;box-sizing:border-box;overflow:auto}
  .ov[hidden]{display:none}
  h1{margin:0;font-size:clamp(24px,5vw,42px);letter-spacing:-1px;text-shadow:0 4px 0 #000}
  h2{margin:0;font-size:clamp(20px,4.2vw,32px);text-shadow:0 3px 0 #000}
  p{margin:0;opacity:.85;font-size:14px;line-height:1.5}
  button{font:inherit;cursor:pointer}
  .big{font-size:20px;font-weight:800;padding:13px 34px;border:0;border-radius:16px;background:#CF5D2A;color:#fff;box-shadow:0 5px 0 #7a3214}
  .big:active{transform:translateY(3px);box-shadow:0 2px 0 #7a3214}
  .sub{font-size:15px;font-weight:700;padding:10px 22px;border:0;border-radius:12px;background:#3a3a40;color:#fff}
  /* 교실(거점) */
  #hub{background:linear-gradient(rgba(14,12,22,.72),rgba(14,12,22,.86)),url(img/hub_bg.png) center/cover no-repeat #1c1c22;image-rendering:pixelated;justify-content:flex-start}
  .hub{display:flex;gap:12px;width:100%;max-width:960px;flex-wrap:wrap;justify-content:center;align-items:stretch}
  .pane{background:#2a2a30;border-radius:18px;padding:12px;box-sizing:border-box}
  .hero{width:300px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .heroTop{display:flex;gap:10px;align-items:center;width:100%}
  .heroTop img{height:96px}
  .lvl{font-size:22px;font-weight:800}
  .bar{width:100%;height:9px;border-radius:5px;background:#111;overflow:hidden}
  .bar i{display:block;height:100%;background:#4fc3ff}
  .stats{font-size:12px;opacity:.9;line-height:1.5;text-align:left}
  .eq{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
  .slot{background:#34343a;border-radius:10px;padding:6px;text-align:left;border:2px solid #444;min-height:52px;font-size:11px;line-height:1.35}
  .slot .nm{font-weight:800;font-size:12px}
  .slot .ic{font-size:18px;float:left;margin-right:4px}
  .frs{width:100%;max-width:832px;display:flex;flex-direction:column;gap:8px;text-align:left}
  .fr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
  .fr{display:flex;gap:8px;align-items:center;background:#34343a;border-radius:10px;padding:6px 8px;font-size:11px;line-height:1.35;opacity:.55}
  .fr.on{opacity:1;border:2px solid #7CFC9A}
  .fr img{height:46px}
  .fr .q{font-size:26px;width:34px;text-align:center}
  .fr b{font-size:13px}
  .fr span{color:#7CFC9A;font-size:11px}
  .grow{flex:1;min-width:280px;max-width:520px;display:flex;flex-direction:column;gap:7px}
  .gold{font-size:18px;font-weight:800;color:#ffd54f}
  .row{display:flex;align-items:center;gap:10px;background:#34343a;border-radius:12px;padding:7px 10px;text-align:left}
  .row .ic{font-size:24px;width:32px;text-align:center}
  .row .t{flex:1}
  .row .t b{font-size:15px}
  .row .t div{font-size:12px;opacity:.85}
  .dots{letter-spacing:1px;color:#ffb27a;font-size:11px}
  .buy{border:0;border-radius:10px;padding:10px 12px;background:#4E9A63;color:#fff;font-weight:800;font-size:14px;min-width:80px}
  .buy:disabled{background:#4a4a50;color:#999}
  /* 게임 중 버튼 */
  .gbtn{position:fixed;border:0;border-radius:50%;color:#fff;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;
    line-height:1.1;touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.4)}
  .gbtn[hidden]{display:none}
  .gbtn span{font-size:12px}
  #pauseBtn.has{background:#b8860b;font-size:15px;animation:pulse .7s infinite alternate}
  #bagBtn{top:max(14px,env(safe-area-inset-top));right:calc(max(10px,env(safe-area-inset-right)) + 52px);width:44px;height:44px;border-radius:0;clip-path:var(--px);background:rgba(0,0,0,.45);box-shadow:none;padding:0}
  #bagBtn.new{animation:pulse .7s infinite alternate;background:#6a4a10}
  .tk-box.alien .tk-t{font-family:monospace;letter-spacing:2px;color:#c9a2ff;animation:alienShake .12s infinite alternate}
  @keyframes alienShake{from{transform:translate(-1px,0)}to{transform:translate(1px,1px)}}
  .tk-radio.port.alien{animation:alienShake .2s infinite alternate}
  /* 매점 */
  #shopOv{background:radial-gradient(ellipse at 50% 0%,#3a2a18,#120c08 72%);justify-content:flex-start;gap:10px;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));overflow:auto}
  .sh-head{display:flex;align-items:center;gap:10px;width:100%;max-width:900px}
  .sh-head .pic{width:40px!important;height:40px!important;flex:none} .sh-head h2{font-size:22px;margin:0} .sh-head .gold{margin-left:auto;font-weight:900;color:#ffd54f;font-size:20px}
  .sh-say{width:100%;max-width:900px;color:#f5dfb0;font-size:15px}
  .sh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:100%;max-width:900px}
  .sh-card{background:#2a1e14;clip-path:var(--px);padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:3px solid #5a4028}
  .sh-card .pic{width:56px;height:56px;image-rendering:pixelated} .sh-card .nm{font-weight:900;font-size:14px;line-height:1.2}
  .sh-card .st{font-size:12px;color:#d9c7a8;min-height:30px}
  .sh-card button{width:100%;font-weight:900;font-size:15px;padding:8px 4px;background:#e0a12a;color:#2a1600;border:0;clip-path:var(--px)}
  .sh-card button:disabled{background:#4a3a2a;color:#9a8a70}
  .sh-card.sold{opacity:.45}
  .sh-close{margin-top:4px;font-size:18px;font-weight:900;padding:12px 40px;background:#6a4a2a;color:#fff;border:0;clip-path:var(--px)}
  #pauseBtn{top:max(14px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:44px;height:44px;border-radius:12px;background:rgba(0,0,0,.45);font-size:20px;box-shadow:none}
  #dashBtn{right:calc(max(16px,env(safe-area-inset-right)) + 104px);bottom:max(18px,env(safe-area-inset-bottom));width:74px;height:74px;font-size:26px;background:rgba(60,140,200,.85)}
  #ultBtn{right:max(16px,env(safe-area-inset-right));bottom:calc(max(18px,env(safe-area-inset-bottom)) + 38px);width:92px;height:92px;font-size:30px;padding:6px}
  #ultBtn .in{width:100%;height:100%;border-radius:50%;background:#2b2b33;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #ultBtn.ready{animation:pulse .7s infinite alternate}
  @keyframes pulse{to{transform:scale(1.08);filter:brightness(1.3)}}
  @media (max-height:500px){ #hub h1{font-size:20px} .heroTop img{height:70px} .ov{gap:8px} }
  /* 기술 나무: 교실 칠판 + 선생님 무전 */
  #treeOv{background:radial-gradient(ellipse at 50% 0%,#2a2238 0%,#100d18 70%);padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));gap:8px;justify-content:center}
  .tr-head{display:flex;align-items:center;gap:10px;width:100%;max-width:1000px}
  .tr-head .radio{font-size:26px;filter:drop-shadow(0 2px 0 #000);animation:radio 1.2s infinite}
  @keyframes radio{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-2px)}}
  .tr-head h2{font-size:18px;letter-spacing:-.5px;white-space:nowrap}
  .selTop h2{white-space:nowrap;font-size:clamp(16px,4.6vw,26px)}
  .selTop .sub{white-space:nowrap;font-size:12px;padding:8px 10px}
  .selTop #msBtn{white-space:normal;min-width:0;flex:0 1 auto;line-height:1.3}
  .selTop{gap:6px}
  .tr-head .sub2{font-size:12px;color:#bfffe9;opacity:.85}
  .tr-head .lvup{white-space:nowrap;color:#ffd54f;font-weight:900;font-size:15px;background:#3a2a10;border-radius:10px;padding:2px 8px}
  .tr-head .pts{margin-left:auto;font-weight:900;font-size:15px;background:#ffd54f;color:#3a2410;border-radius:12px;padding:5px 12px;box-shadow:0 3px 0 #a07a10;white-space:nowrap}
  .tr-head .pts.zero{background:#3a3a44;color:#aaa;box-shadow:0 3px 0 #222}
  .tr-body{display:flex;gap:12px;width:100%;max-width:1000px;align-items:stretch;justify-content:center;min-height:0}
  /* 칠판 */
  .tr-wrap{flex:none;position:relative;overflow:hidden;border-radius:14px;touch-action:none;cursor:grab;
    background:radial-gradient(ellipse at 30% 25%,rgba(255,255,255,.07),transparent 55%),radial-gradient(ellipse at 75% 80%,rgba(255,255,255,.05),transparent 50%),
      repeating-linear-gradient(115deg,rgba(255,255,255,.015) 0 3px,transparent 3px 9px),#23463a;
    box-shadow:0 0 0 10px #8b5a2b,0 0 0 13px #5e3a18,inset 0 0 40px rgba(0,0,0,.55),0 10px 24px rgba(0,0,0,.6)}
  .tr-wrap .drag{position:absolute;right:8px;bottom:6px;font-size:11px;font-weight:800;color:#f3f1e4;opacity:.65;pointer-events:none}
  .tr-board{position:absolute;left:0;top:0;transform-origin:0 0}
  .tr-board svg{position:absolute;inset:0;overflow:visible}
  .tr-board .tray{position:absolute;bottom:-11px;left:8%;width:84%;height:9px;background:#6b4220;border-radius:3px}
  .tr-board .tray i{position:absolute;top:-5px;height:6px;border-radius:3px}
  .tr-title{position:absolute;font-weight:900;color:#f3f1e4;text-shadow:0 0 6px rgba(255,255,255,.35);font-size:20px;letter-spacing:1px;opacity:.9}
  .tr-teach{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
  .tr-teach .face{width:40px;height:40px;border-radius:50%;background:var(--c);border:3px solid #f3f1e4;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.4)}
  .tr-teach .nm{font-size:13px;font-weight:900;color:#f3f1e4;text-shadow:0 2px 0 #0008;white-space:nowrap}
  .tr-n{position:absolute;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;padding:0;color:#fff;
    border:3px dashed rgba(243,241,228,.45);background:rgba(10,30,24,.55);display:flex;align-items:center;justify-content:center;transition:transform .15s}
  .tr-n .e{font-size:27px;line-height:1;filter:grayscale(.6) brightness(.8);display:flex}
  .pic{image-rendering:pixelated;display:inline-block;vertical-align:middle;-webkit-user-drag:none}
  .tr-n .e .pic{width:38px;height:38px;object-fit:contain}
  .pt .tr-n .e .pic{width:32px;height:32px}
  .tr-c .bd span .pic{width:40px;height:40px;object-fit:contain}
  .tr-side .ic .pic{width:44px;height:44px;object-fit:contain}
  .tr-side .ic.port .pic{width:64px;height:64px;border-radius:12px;background:#efe6cc;object-fit:cover;object-position:top}
  .pic.mini{width:18px;height:18px;object-fit:contain;vertical-align:-4px}
  .pic.it{width:30px;height:30px;object-fit:contain}
  .tr-head .radio .pic{width:34px;height:34px}
  .tr-n .pp{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
  .tr-n .pp b{width:7px;height:7px;background:rgba(243,241,228,.25);border-radius:2px}
  .tr-n .pp b.on{background:#ffe27a;box-shadow:0 0 4px #ffcf3f}
  .tr-n.can{border:3px solid #f3f1e4}
  .tr-n.can .e{filter:none}
  .tr-n.has{border:3px solid #f3f1e4;background:var(--c);box-shadow:0 0 0 3px rgba(0,0,0,.25),0 0 14px color-mix(in srgb,var(--c) 80%,transparent)}
  .tr-n.has .e{filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
  .tr-n.can:not(.has){animation:chalk 1s infinite alternate}
  @keyframes chalk{from{box-shadow:0 0 0 0 rgba(255,226,122,0)}to{box-shadow:0 0 0 5px rgba(255,226,122,.35),0 0 16px rgba(255,226,122,.6)}}
  .tr-n.lock{opacity:.55}
  .tr-n.lock::before{content:'🔒';position:absolute;top:-6px;left:-6px;font-size:15px}
  .tr-n.max::before{content:'⭐';position:absolute;top:-9px;left:-8px;font-size:17px}
  .tr-n.rec::after{content:'추천';position:absolute;top:-10px;right:-14px;font-size:10px;font-weight:900;background:#ff5a4a;color:#fff;border-radius:7px;padding:1px 5px;transform:rotate(12deg);box-shadow:0 2px 0 #0006}
  .tr-n.on-sel{transform:translate(-50%,-50%) scale(1.13);outline:3px solid #ffe27a;outline-offset:3px}
  .pt .tr-n{width:50px;height:50px} .pt .tr-n .e{font-size:23px} .pt .tr-n .pp{bottom:-10px}
  .pt .tr-teach .face{width:36px;height:36px;font-size:18px} .pt .tr-teach .nm{font-size:12px}
  .tr-n.pas{border-radius:16px}
  .tr-n.pas::after{content:'';}
  .tr-me{position:absolute;transform:translate(-50%,-50%);width:78px;height:78px;border-radius:50%;background:radial-gradient(#3a6b5a,#1b3a30);border:4px solid #f3f1e4;
    box-shadow:0 0 0 4px rgba(0,0,0,.3),0 0 24px rgba(255,236,160,.35);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;pointer-events:none}
  .tr-me img{height:96%;image-rendering:pixelated}
  .tr-me b{position:absolute;bottom:-2px;font-size:11px;font-weight:900;background:#ffd54f;color:#3a2410;border-radius:8px;padding:0 6px}
  .tr-c{position:absolute;transform:translate(-50%,-50%);width:66px;height:66px;padding:0;border:0;background:none;color:#fff}
  .tr-c .bd{width:66px;height:66px;border-radius:18px;transform:rotate(45deg);background:color-mix(in srgb,var(--c) 30%,#1a2a24);border:3px dashed rgba(243,241,228,.45);
    display:flex;align-items:center;justify-content:center;box-sizing:border-box}
  .tr-c .bd span{transform:rotate(-45deg);font-size:28px}
  .tr-c .lb{position:absolute;left:50%;top:100%;transform:translate(-50%,8px);white-space:nowrap;font-size:13px;font-weight:900;color:#f3f1e4;text-shadow:0 2px 0 #000a;line-height:1.1}
  .tr-c .lb small{display:block;font-size:10px;opacity:.75;font-weight:700}
  .tr-c.wait,.tr-c.other{opacity:.55}
  .tr-c.pick .bd{border:3px solid #ffe27a;animation:chalk .7s infinite alternate}
  .tr-c.chosen .bd{background:var(--c);border:4px solid #f3f1e4;box-shadow:0 0 22px var(--c)}
  .tr-c.on-sel .bd{outline:3px solid #ffe27a;outline-offset:4px}
  .tr-side .cls{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
  .tr-side .cls span{font-size:12px;background:#efe6cc;border-radius:8px;padding:2px 6px}
  .pick-btn{border:0;border-radius:12px;padding:10px 0;width:100%;color:#fff;font-weight:900;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
  .tr-b{position:absolute;transform:translate(-50%,-50%);width:50px;height:50px;padding:0;border:0;background:none;color:#fff}
  .tr-b .stamp{width:50px;height:50px;border-radius:50%;border:3px dashed rgba(243,241,228,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-size:18px;color:rgba(243,241,228,.6)}
  .tr-b .stamp small{font-size:10px;font-weight:900}
  .tr-b.t1 .stamp{border:3px solid var(--c);color:#fff;background:color-mix(in srgb,var(--c) 35%,transparent);transform:rotate(-8deg)}
  .tr-b.t2 .stamp{border:3px solid #ffd54f;color:#ffd54f;background:color-mix(in srgb,var(--c) 55%,#3a2a10);transform:rotate(-8deg);box-shadow:0 0 12px #ffcf3f88}
  .tr-b.on-sel .stamp{outline:3px solid #ffe27a;outline-offset:3px}
  /* 오른쪽: 교무수첩 */
  .tr-side{width:220px;flex:none;background:repeating-linear-gradient(#fbf6e4 0 21px,#d8e6f2 21px 22px);color:#2b2620;border-radius:6px 14px 14px 6px;
    padding:12px 12px 12px 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;text-align:left;position:relative;box-shadow:0 8px 18px rgba(0,0,0,.5)}
  .tr-side::before{content:'';position:absolute;left:12px;top:0;bottom:0;width:2px;background:#ef8b8b}
  .tr-side .ic{font-size:34px;line-height:1}
  .tr-side .nm{font-size:18px;font-weight:900}
  .tr-side .tc{font-size:11px;font-weight:800;padding:2px 8px;border-radius:8px;display:inline-block;color:#fff}
  .tr-side .lvt{font-size:13px;color:#b5501f;font-weight:800}
  .tr-side .ds{font-size:13px;line-height:1.45}
  .tr-side .ds b{font-weight:800}
  .tr-side .why{font-size:12px;color:#d03a2a;font-weight:700}
  .tr-side .sp{flex:1}
  .tr-side .big{font-size:17px;padding:10px 0;width:100%}
  .tr-side .sub{width:100%;padding:8px 0;border:0;border-radius:10px;background:#e6dcc0;color:#4a3a28;font-weight:800}
  .learn{border:0;border-radius:12px;padding:10px 0;width:100%;background:#4E9A63;color:#fff;font-weight:900;font-size:16px;box-shadow:0 4px 0 #2c5c3a}
  .learn:disabled{background:#cfc6ae;color:#8a7f6a;box-shadow:none}
  @media (orientation:portrait){ .tr-body{flex-direction:column;align-items:center} .tr-side{width:100%;max-width:none;gap:3px;padding:6px 10px 6px 22px;max-height:34vh;overflow:auto} .tr-side .ic{font-size:28px} .tr-side .big{padding:8px 0} .learn{padding:8px 0} }
  .big:disabled{background:#4a4a50;color:#999;box-shadow:none}
  /* 시작 페이지 */
  #titleOv{background:#0d0b1a;padding:0}
  #tcv{position:absolute;inset:0;width:100%;height:100%}
  .tt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;
    padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box;pointer-events:none}
  .tt h1{margin:auto 0;font-size:clamp(40px,12vmin,96px);font-weight:900;color:#fff4c9;letter-spacing:-1px;-webkit-text-stroke:2px #3a1d5c;
    text-shadow:0 6px 0 #3a1d5c,0 0 28px #b07cff;opacity:0;transform:translateY(-90px) scale(1.4);transition:opacity .3s,transform .5s cubic-bezier(.3,1.7,.5,1)}
  .tt .foot{display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;transform:translateY(30px);transition:opacity .4s .35s,transform .4s .35s}
  .tt.on h1,.tt.on .foot{opacity:1;transform:none}
  .tt.on .foot{pointer-events:auto}
  .tt .tag{font-size:clamp(14px,2.8vmin,20px);font-weight:800;color:#bfffe9;text-shadow:0 2px 0 #000,0 0 10px #000}
  .tt .big{animation:pulse .8s infinite alternate}
  .skip{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));font-size:13px;padding:7px 12px;border:0;border-radius:10px;background:rgba(0,0,0,.45);color:#fff}
  .skip[hidden]{display:none}
  /* 캐릭터 선택 */
  #selectOv{background:radial-gradient(ellipse at 50% 0%,#3b2a6b 0%,#15121f 72%)}
  #selectOv::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent 0 47px,rgba(127,255,212,.07) 47px 48px),repeating-linear-gradient(90deg,transparent 0 47px,rgba(127,255,212,.07) 47px 48px)}
  .selTop{position:relative;display:flex;align-items:center;gap:12px;width:100%;max-width:920px}
  .selTop h2{flex:1}

  { name: '실험실이 뒤집힌 층', room: [110, 1.05, 0.97], hall: [300, 0.9, 1.0], wall: [220, 0.9, 0.95], swap: 0.3, rubik: 5, glow: 0, dark: 0.07, tint: '70,10,130' },

];

  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur);
}

function inputDir() {
  let dx = 0, dy = 0;
  if (keys['arrowleft'] || keys['a']) dx -= 1;
  if (keys['arrowright'] || keys['d']) dx += 1;
  if (keys['arrowup'] || keys['w']) dy -= 1;
  if (keys['arrowdown'] || keys['s']) dy += 1;
  if (stick.on) {
    const vx = stick.x - stick.sx, vy = stick.y - stick.sy, l = Math.hypot(vx, vy);
    if (l > 8) { const k = Math.min(1, l / 55); dx = vx / l * k; dy = vy / l * k; }
  }
  let l = Math.hypot(dx, dy);
  if (l > 1) { dx /= l; dy /= l; l = 1; }
  // 비스듬한 시점: 화면에서 민 방향을 세계(위에서 본) 방향으로 바꿔요
  if (l > 0) { const wx = dy + dx / 2, wy = dy - dx / 2, m = Math.hypot(wx, wy); dx = wx / m * l; dy = wy / m * l; }
  return { dx, dy };
}

function drawSky(g, t, dusk) {
  const gr = g.createLinearGradient(0, -300, 0, 620);

  g.fillStyle = gr; g.fillRect(-20, -900, 1320, 1660);
  if (dusk > 0.5) { g.fillStyle = `rgba(255,255,255,${(dusk - 0.5) * 1.6})`;
    for (let i = 0; i < 40; i++) { const x = (i * 337) % 1280, y = (i * 151) % 300; g.fillRect(x, y, 2 + (i % 2), 2 + (i % 2)); } }
  for (let i = 0; i < 5; i++) {
    const x = ((i * 290 + t * (10 + i * 3)) % 1500) - 150, y = 70 + (i * 53) % 170, w = 120 + (i * 37) % 90;
    g.fillStyle = dusk < 0.5 ? `rgba(255,255,255,${0.85 - dusk})` : `rgba(240,160,200,${0.25 + 0.2 * (1 - dusk)})`;
    g.beginPath(); g.ellipse(x, y, w, 26, 0, 0, 7); g.ellipse(x - w * 0.4, y + 6, w * 0.5, 22, 0, 0, 7); g.ellipse(x + w * 0.45, y + 4, w * 0.55, 24, 0, 0, 7); g.fill();
  }
}

function drawSchool(g, t, dusk) {
  const B = 610, T = 250, bl = 220, br = 1060, tl = 320, tr = 960;
  const pt = (fx, fy) => [bl + (tl - bl) * fy + ((br - bl) + ((tr - tl) - (br - bl)) * fy) * fx, B + (T - B) * fy];
  const quad = (a, b, c, d2) => { g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.lineTo(...c); g.lineTo(...d2); g.closePath(); };
  g.fillStyle = mix('#cfa978', '#4a3550', dusk); g.fillRect(-20, 600, 1320, 1100);           // 운동장
  // 가운데 시계탑
  g.fillStyle = mix('#e9dcb8', '#6e5d82', dusk); quad([575, 260], [705, 260], [690, 150], [590, 150]); g.fill();
  g.fillStyle = mix('#5c9c96', '#2e4c5a', dusk); quad([583, 158], [697, 158], [693, 140], [587, 140]); g.fill();
  g.fillStyle = '#fffaf0'; g.beginPath(); g.arc(640, 205, 27, 0, 7); g.fill(); g.strokeStyle = '#3e4a52'; g.lineWidth = 4; g.stroke();
  g.beginPath(); g.moveTo(640, 205); g.lineTo(640, 186); g.moveTo(640, 205); g.lineTo(654, 212); g.stroke();
  // 본관 벽
  g.fillStyle = mix('#f3e7c6', '#8a7895', dusk); quad(pt(0, 0), pt(1, 0), pt(1, 1), pt(0, 1)); g.fill();
  g.fillStyle = mix('#3e4a52', '#24202f', dusk); quad(pt(-0.01, 1), pt(1.01, 1), pt(1.01, 1.03), pt(-0.01, 1.03)); g.fill();  // 지붕 끝
  for (let f = 1; f < 4; f++) { g.fillStyle = mix('#5c9c96', '#36566a', dusk); quad(pt(0, f / 4 - 0.012), pt(1, f / 4 - 0.012), pt(1, f / 4 + 0.012), pt(0, f / 4 + 0.012)); g.fill(); }
  for (let f = 0; f < 4; f++) for (let c = 0; c < 10; c++) {
    if (f === 0 && (c === 4 || c === 5)) continue;
    const x0 = c / 10 + 0.018, x1 = (c + 1) / 10 - 0.018, y0 = f / 4 + 0.06, y1 = (f + 1) / 4 - 0.05;
    const lit = dusk > 0.7 && ((c * 7 + f * 3) % 5 === 0);
    g.fillStyle = lit ? '#ffd27a' : mix('#a9dcf0', '#2d2650', dusk);
    quad(pt(x0, y0), pt(x1, y0), pt(x1, y1), pt(x0, y1)); g.fill();
    g.strokeStyle = mix('#5c9c96', '#3a3550', dusk); g.lineWidth = 3; g.stroke();
  }
  g.fillStyle = mix('#5a4636', '#2a1f2a', dusk); quad(pt(0.4, 0), pt(0.6, 0), pt(0.6, 0.2), pt(0.4, 0.2)); g.fill();   // 현관
  // 앞쪽 나무 · 교문
  for (const [x, sz] of [[90, 1.15], [1190, 1.2], [300, 0.7], [985, 0.75]]) {
    g.fillStyle = mix('#6b4a2e', '#2a1d26', dusk); g.fillRect(x - 10 * sz, 560, 20 * sz, 160);
    g.fillStyle = mix('#5aa65a', '#253a3a', dusk);
    for (const [ox, oy, r] of [[0, -40, 80], [-55, 0, 60], [55, 0, 62], [0, 20, 65]]) { g.beginPath(); g.arc(x + ox * sz, 560 + oy * sz, r * sz, 0, 7); g.fill(); }
  }
  g.fillStyle = mix('#9aa3a8', '#3c3a4a', dusk); g.fillRect(430, 600, 34, 120); g.fillRect(816, 600, 34, 120);
}
function drawCube(g, t, oy, p) {
  const L = 170, R = 1110, Tp = 110, Bt = 650, dx = 60, dy = -50;
  g.save(); g.translate(0, oy); g.globalAlpha = Math.min(1, p * 2.5);
  const glow = 0.75 + 0.25 * Math.sin(t * 4);
  g.fillStyle = 'rgba(176,124,255,0.13)'; g.fillRect(L, Tp, R - L, Bt - Tp);
  g.fillStyle = 'rgba(176,124,255,0.08)';
  g.beginPath(); g.moveTo(L, Tp); g.lineTo(L + dx, Tp + dy); g.lineTo(R + dx, Tp + dy); g.lineTo(R, Tp); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(R, Tp); g.lineTo(R + dx, Tp + dy); g.lineTo(R + dx, Bt + dy); g.lineTo(R, Bt); g.closePath(); g.fill();
  g.shadowColor = '#7fffd4'; g.shadowBlur = 14; g.strokeStyle = `rgba(127,255,212,${0.55 * glow})`; g.lineWidth = 2;
  g.beginPath();
  for (let i = 1; i < 10; i++) { const x = L + (R - L) * i / 10; g.moveTo(x, Tp); g.lineTo(x, Bt); }
  for (let i = 1; i < 6; i++) { const y = Tp + (Bt - Tp) * i / 6; g.moveTo(L, y); g.lineTo(R, y); }
  for (let i = 1; i < 10; i++) { const x = L + (R - L) * i / 10; g.moveTo(x, Tp); g.lineTo(x + dx, Tp + dy); }
  g.stroke();
  g.strokeStyle = `rgba(190,255,235,${glow})`; g.lineWidth = 5;
  g.beginPath(); g.rect(L, Tp, R - L, Bt - Tp);
  g.moveTo(L, Tp); g.lineTo(L + dx, Tp + dy); g.lineTo(R + dx, Tp + dy); g.lineTo(R, Tp);
  g.moveTo(R + dx, Tp + dy); g.lineTo(R + dx, Bt + dy); g.lineTo(R, Bt); g.stroke();
  g.restore();
}
function drawUfo(g, t, x, y) {
  if (TIMG.start_ufo) { const im = TIMG.start_ufo, w = 400, h = w * im.height / im.width; g.drawImage(im, x - w / 2, y - h / 2, w, h); return; }
  g.save(); g.translate(x, y);
  const ug = g.createRadialGradient(0, 30, 10, 0, 30, 140); ug.addColorStop(0, 'rgba(127,255,212,.8)'); ug.addColorStop(1, 'rgba(127,255,212,0)');
  g.fillStyle = ug; g.beginPath(); g.ellipse(0, 34, 140, 34, 0, 0, 7); g.fill();
  g.fillStyle = 'rgba(170,240,255,.75)'; g.strokeStyle = '#2b1d4a'; g.lineWidth = 5;
  g.beginPath(); g.ellipse(0, -22, 72, 56, 0, Math.PI, 0); g.fill(); g.stroke();
  g.fillStyle = 'rgba(255,255,255,.6)'; g.beginPath(); g.ellipse(-24, -48, 14, 9, -0.5, 0, 7); g.fill();
  const bg = g.createLinearGradient(0, -30, 0, 40); bg.addColorStop(0, '#d9cbf7'); bg.addColorStop(1, '#6f58b8');
  g.fillStyle = bg; g.beginPath(); g.ellipse(0, 0, 200, 44, 0, 0, 7); g.fill(); g.stroke();
  g.fillStyle = '#4a3a86'; g.beginPath(); g.ellipse(0, 22, 120, 20, 0, 0, Math.PI); g.fill();
  g.fillStyle = '#7fffd4'; g.fillRect(-14, -8, 28, 22); g.strokeStyle = '#2b1d4a'; g.lineWidth = 3; g.strokeRect(-14, -8, 28, 22);   // 네모 무늬
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2 + t * 1.5, lx = Math.cos(a) * 172, ly = Math.sin(a) * 30 + 4;
    if (Math.sin(a) < -0.2) continue;
    const on = (i + Math.floor(t * 6)) % 3 === 0;
    g.fillStyle = i % 2 ? (on ? '#ff6bd6' : '#a0407f') : (on ? '#b8fff0' : '#3f9e8a');
    g.beginPath(); g.arc(lx, ly, 8, 0, 7); g.fill();
  }
  g.restore();
}
function drawTitleHero(g, t, dusk) {
